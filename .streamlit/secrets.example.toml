# COPIEZ ce fichier vers .streamlit/secrets.toml uniquement pour un test local.
# Dans Community Cloud, saisissez ces valeurs dans Settings > Secrets.
# Ne placez jamais le vrai fichier secrets.toml dans GitHub.

[application]
auth_required = true
allowed_email_domain = "nsiaassurances.com"

# Authentification des utilisateurs avec Microsoft Entra ID.
[auth]
redirect_uri = "https://VOTRE-APPLICATION.streamlit.app/oauth2callback"
cookie_secret = "GENEREZ-UNE-LONGUE-VALEUR-ALEATOIRE"
client_id = "IDENTIFIANT-APPLICATION-ENTRA"
client_secret = "SECRET-APPLICATION-ENTRA"
server_metadata_url = "https://login.microsoftonline.com/IDENTIFIANT-TENANT/v2.0/.well-known/openid-configuration"

# Accès serveur à SharePoint avec Microsoft Graph.
[sharepoint]
tenant_id = "IDENTIFIANT-TENANT"
client_id = "IDENTIFIANT-APPLICATION-ENTRA"
client_secret = "SECRET-APPLICATION-ENTRA"
site_url = "https://assurancesnsia.sharepoint.com/sites/NSIACallCenter"
calls_list = "APPELS_CALL_CENTER"
references_list = "REFERENCES_CALL_CENTER"
timeout_seconds = 30

