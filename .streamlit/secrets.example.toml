    client_secret = "VOTRE_CLIENT_SECRET"

    [sharepoint]
    tenant_id = "VOTRE_TENANT_ID"
    client_id = "VOTRE_CLIENT_ID"
    client_secret = "VOTRE_CLIENT_SECRET"
    site_url = "https://assurancesnsia.sharepoint.com/sites/NSIACallCenter"

